name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Check public-release hygiene
        run: npm run check:public

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test portable Windows lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup-windows.test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup-windows-recovery.test.ps1

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor
